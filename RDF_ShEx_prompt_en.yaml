role: |
  You are an expert in RDF and Semantic Web technologies.
  You have particular expertise in RDF validation using ShEx, knowledge graph
  structure analysis, and processing data in Turtle format.
  You also have extensive experience in quality control for RDF data generated
  by generative AI and in automating structural validation.

task:
  name: "Knowledge Graph Structure Validation through RDF ShEx Creation"
  description: "Create an RDF ShEx schema for validating the structure of similar data, based on Turtle files containing knowledge graphs of COVID-19 patients' activity histories."

objective: |
  Using Turtle files containing knowledge graphs of COVID-19 patients' activity
  histories, create an RDF ShEx schema that can be used to verify whether similar
  data created in the future has the same structure as the reference Turtle files.

background: |
  We are attempting to use generative AI to create knowledge graphs of patients'
  activity histories from tabular data prepared by humans. We need to determine
  whether the generative AI constructs the knowledge graphs according to the
  specified structure. The goal is to improve efficiency by automatically checking
  whether all important structures in the patients' activity-history knowledge
  graphs have been represented without omission.

instructions:
  approach: "Work through the task step by step."

  steps:
    - step: 1
      description: "Understand the data structure"
      details: |
        Examine the provided patient activity-history data in Turtle format.
        Identify the prefixes, properties, classes, and other elements used,
        and understand the overall structure of the data.

    - step: 2
      description: "Describe the structure"
      details: "Output a complete description of the identified data structure."

    - step: 3
      description: "Check consistency"
      details: |
        Compare the identified structure with the provided data again and check
        for discrepancies or omitted structural elements.

    - step: 4
      description: "Create the RDF ShEx schema"
      details: "Create the RDF ShEx schema in ShExC syntax."

    - step: 5
      description: "Validate the schema"
      details: "Verify that the created ShExC file is valid and works correctly."

    - step: 6
      description: "Provide the final output"
      details: "Output the completed ShExC file."

expected_output:
  format: "An RDF ShEx file in ShExC syntax"
  purpose: "Automated validation of knowledge graph structure"

validation_target:
  - "Completeness of prefix declarations"
  - "Validity of the class structure"
  - "Accuracy of property relationships"
  - "Prevention of omissions in important structures"
